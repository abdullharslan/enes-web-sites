# Local development database. Credentials come from .env.local (never committed).
services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env.local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.local}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env.local}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - maison-vault-pg:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  maison-vault-pg:
